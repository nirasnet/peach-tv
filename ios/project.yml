name: PeachRemote
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # your Apple Team ID
targets:
  PeachRemote:
    type: application
    platform: iOS
    sources: [PeachRemote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PeachRemote
        PRODUCT_NAME: Peach Remote
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: PeachRemote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    dependencies:
      # The built-in Tailscale (scripts/build-tailscalekit.sh)
      - framework: Frameworks/TailscaleKit.xcframework
        embed: true
        codeSign: true
